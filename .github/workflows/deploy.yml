# ビルドした dist/ を GitHub Pages へ配信する。
#
# リポジトリのルートにある index.html は Vite の入力ファイル（<script src="/src/main.ts">）で、
# そのまま配信してもブラウザは TypeScript を実行できない。
# 必ずこのワークフローでビルドした dist/ を配信すること。
#
# configure-pages の enablement で配信元の切り替えを試みるが、権限などで切り替わらない
# 場合は、リポジトリの Settings → Pages → Build and deployment → Source を
# 手動で「GitHub Actions」に変更する必要がある。
# （「Deploy from a branch」のままだと、ビルド前の index.html がそのまま配信される）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は1つに絞る（実行中のデプロイは中断しない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm run build は tsc --noEmit も走るので、型エラーがあればここで止まる
      - run: npm run build

      # enablement: true で Pages の配信元を「GitHub Actions」へ切り替える。
      # 切り替えに失敗しても、後段のデプロイ自体は行えるよう続行する。
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
