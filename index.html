<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12151c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="水と砂で川・谷・中州・扇状地をつくる地形シミュレーションゲーム" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c8a86a'/%3E%3Cpath d='M6 25c4-3 5-8 9-11s7-2 11-6' stroke='%232f8fd6' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>River — 水と砂の河川地形シミュレーション</title>
  </head>
  <body>
    <div id="app">
      <canvas id="board"></canvas>

      <!-- 上部HUD -->
      <div id="hud" class="hud">
        <div class="hud-row">
          <button id="btn-menu" class="chip" type="button" aria-label="メニュー">☰</button>
          <div class="hud-title">
            <div id="stage-name">自由モード</div>
            <div id="stage-sub" class="sub">砂を盛り、水を流す</div>
          </div>
          <div id="hud-time" class="chip time">0:00</div>
        </div>
        <div id="objectives" class="objectives"></div>
        <div id="meters" class="meters"></div>
      </div>

      <!-- 水量スライダー -->
      <div id="water-slider" class="water-slider" role="slider" aria-label="水源の流量"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="ws-track">
          <div class="ws-fill"></div>
          <div class="ws-min"></div>
          <div class="ws-thumb"></div>
        </div>
        <div class="ws-marks">
          <span>洪水</span><span>増水</span><span>通常</span><span>細流</span><span>停止</span>
        </div>
        <div class="ws-caption">水量</div>
      </div>

      <!-- 下部ツールバー -->
      <div id="toolbar" class="toolbar">
        <div class="tool-row">
          <button class="tool" data-tool="raise" type="button">盛る</button>
          <button class="tool" data-tool="lower" type="button">削る</button>
          <button class="tool" data-tool="camera" type="button">視点移動</button>
          <button id="btn-view" class="tool" type="button">斜め視点</button>
        </div>
        <div class="tool-row">
          <div class="seg" id="brush-seg" aria-label="ブラシの大きさ"></div>
          <div class="seg" id="speed-seg" aria-label="シミュレーション速度"></div>
        </div>
        <div id="sand-bar" class="sand-bar"></div>
      </div>

      <!-- オーバーレイ（タイトル / 結果 / 設定） -->
      <div id="overlay" class="overlay"></div>
      <div id="toast" class="toast" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
